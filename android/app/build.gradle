plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "kotlin-kapt"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace "hust.appchat"

    compileSdk 36
    ndkVersion = "28.2.13676358"

    signingConfigs {
        release {
            def keystorePath = localProperties.getProperty('RELEASE_STORE_FILE')
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword localProperties.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias localProperties.getProperty('RELEASE_KEY_ALIAS')
                keyPassword localProperties.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "hust.appchat"
        minSdkVersion 30
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def keystorePath = localProperties.getProperty('RELEASE_STORE_FILE')
            if (keystorePath != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    lint {
        disable 'InvalidPackage'
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'], exclude: ['deepar.aar'])

    // ─── Firebase ────────────────────────────────────────────────────────────
    // BOM 34.14.0 — phát hành 28/05/2026 (latest as of 20/06/2026)
    // Khi dùng BOM, KHÔNG khai báo version riêng cho từng Firebase library
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // App Check — Android dùng Play Integrity (KHÔNG dùng recaptcha: đó là Web-only)
    // firebase-appcheck-recaptcha KHÔNG TỒN TẠI trên Android Maven → NGUYÊN NHÂN LỖI BUILD
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'

    // ─── Google Play Services ─────────────────────────────────────────────────
    implementation 'com.google.android.gms:play-services-auth:21.6.0'       // 21.6.0 — 27/05/2026
    implementation 'com.google.android.gms:play-services-location:21.3.0'   // stable

    // ─── Kotlin & Coroutines ──────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // ─── AndroidX Core ────────────────────────────────────────────────────────
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ─── Lifecycle ────────────────────────────────────────────────────────────
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    // ─── Desugaring ───────────────────────────────────────────────────────────
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // ─── Glide ────────────────────────────────────────────────────────────────
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'

    // ─── Gson ─────────────────────────────────────────────────────────────────
    implementation 'com.google.code.gson:gson:2.10.1'

    // ─── OkHttp ───────────────────────────────────────────────────────────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ─── Testing ──────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.21'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.3.21'
        force 'androidx.activity:activity:1.9.3'
        force 'androidx.activity:activity-ktx:1.9.3'
    }
}

kapt {
    correctErrorTypes true
    useBuildCache true
}