name: flutter_chat_demo
description: |
  Production chat app with advanced Android Bubble API, WindowManager overlay, 
  contextual adaptive UI, real-time Firestore, AR filters, and Game Center.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0

  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4
  cloud_firestore: ^6.6.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  cloud_functions: ^6.3.1
  firebase_app_check: ^0.4.5
  # Thêm Firebase Remote Config để kiểm soát Model ID (Khắc phục Technical Debt)
  firebase_remote_config: ^6.0.0

  # ── Authentication ────────────────────────────────────────────────────────
  google_sign_in: ^6.2.1
  local_auth: ^3.0.0

  # ── State management ──────────────────────────────────────────────────────
  provider: ^6.1.5+1

  # ── Local storage & Cache ─────────────────────────────────────────────────
  shared_preferences: ^2.5.5
  path_provider: ^2.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  flutter_secure_storage: ^10.2.0
  flutter_cache_manager: ^3.3.2

  # ── Media, Files & Images ─────────────────────────────────────────────────
  image_picker: ^1.2.0
  file_picker: ^11.0.2
  video_player: ^2.11.1
  photo_view: ^0.15.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.4
  image: ^4.2.0

  # ── Audio & Voice ─────────────────────────────────────────────────────────
  audio_session: ^0.1.21
  just_audio: ^0.10.5
  audio_waveforms: ^2.0.2
  record: ^6.2.1
  noise_meter: ^5.1.0
  speech_to_text: ^7.3.0

  # ── UI, Animations & Utils ────────────────────────────────────────────────
  fluttertoast: ^9.0.0
  intl: ^0.20.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  salomon_bottom_bar: ^3.3.2
  uuid: ^4.5.1
  timeago: ^3.6.1
  clipboard: ^0.1.3
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.7.0
  emoji_picker_flutter: ^3.0.0
  google_fonts: ^6.2.1
  flutter_card_swiper: ^7.2.0
  simple_pip_mode: ^1.1.0
  flutter_markdown: ^0.7.7+1

  # ── Networking, URL & WebRTC ──────────────────────────────────────────────
  connectivity_plus: ^7.1.1
  http: ^1.5.0
  dio: ^5.4.3+1
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  any_link_preview: ^3.0.1
  agora_rtc_engine: ^6.5.0
  wakelock_plus: ^1.2.8

  # ── Location & Sensors ────────────────────────────────────────────────────
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.17.1
  sensors_plus: ^7.0.0

  # ── Notifications & Permissions ───────────────────────────────────────────
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0
  permission_handler: ^12.0.0

  # ── QR, Camera, AR & AI ───────────────────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.0
  camera: ^0.11.0+2
  deepar_flutter_plus: ^0.2.1
  ffmpeg_kit_flutter_new: ^4.2.1
  google_mlkit_face_detection: ^0.11.0

  # ── Crypto & Security ─────────────────────────────────────────────────────
  crypto: ^3.0.7
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  basic_utils: ^5.7.0
  otp: ^3.1.2

  # ── Game Center ───────────────────────────────────────────────────────────
  chess: ^0.8.1

  # ── Other Utilities ───────────────────────────────────────────────────────
  path: ^1.9.0
  translator: ^1.0.0
  package_info_plus: ^9.0.1
  emoji_regex: ^0.0.5
  # Nâng cấp Firebase AI lên bản mới nhất hỗ trợ các tính năng như URL Context & Grounding
  firebase_ai: ^3.13.0
  google_sign_in_web: ^0.12.4+4
  device_info_plus: ^12.4.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.10
  hive_generator: ^2.0.1
  flutter_gen_runner: ^5.4.0
  mockito: ^5.4.4

dependency_overrides:
  permission_handler: ^12.0.0
  firebase_auth: ^6.0.0
  record_linux: ^1.1.0

flutter:
  uses-material-design: true

  assets:
    - images/
    - .env
    - assets/effects/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800